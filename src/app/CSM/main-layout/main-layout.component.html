<nz-layout class="app-layout">
  <nz-sider
    [(nzCollapsed)]="isCollapsed"
    [nzTrigger]="null"
    class="menu-sidebar"
    nzBreakpoint="md"
    nzCollapsible
    nzWidth="256px"
  >
    <div class="sidebar-logo">
      <a>
        <img alt="logo" src="https://ng.ant.design/assets/img/logo.svg"/>
        <h1>TRANSPORTES Chiziane</h1>
      </a>
    </div>

    <ul [nzInlineCollapsed]="isCollapsed" nz-menu nzMode="inline" nzTheme="dark">

      <!-- ===== INÍCIO ===== -->
      <li nz-menu-item nzMatchRouter>
        <a routerLink="/app/dashboard">
          <span nz-icon nzType="dashboard"></span>
          <span>Dashboard</span>
        </a>
      </li>

      <li nz-menu-divider></li>

      <!-- ===== OPERAÇÕES (Carradas) ===== -->
      <li nz-submenu nzIcon="car" nzOpen nzTitle="Operações">
        <ul>

          <li nz-menu-item nzMatchRouter>
            <a routerLink="/app/carload">
              <span nz-icon nzType="unordered-list"></span>
              <span>Carradas</span>
            </a>
          </li>

          <li nz-menu-item nzMatchRouter>
            <a routerLink="/app/sprint">
              <span nz-icon nzType="partition"></span>
              <span>Sprints</span>
            </a>
          </li>

          <li nz-menu-item nzMatchRouter>
            <a routerLink="/app/carload-customer">
              <span nz-icon nzType="team"></span>
              <span>Clientes</span>
            </a>
          </li>

        </ul>
      </li>

      <!-- ===== EQUIPA & FROTA ===== -->
      <li nz-submenu nzIcon="solution" nzTitle="Equipa & Frota">
        <ul>

          <li nz-menu-item nzMatchRouter>
            <a routerLink="/app/driver">
              <span nz-icon nzType="idcard"></span>
              <span>Motoristas</span>
            </a>
          </li>

          <li nz-menu-item nzMatchRouter>
            <a routerLink="/app/manager">
              <span nz-icon nzType="user-switch"></span>
              <span>Gestores</span>
            </a>
          </li>

        </ul>
      </li>

      <!-- ===== FINANCEIRO ===== -->
      <li nz-submenu nzIcon="wallet" nzTitle="Financeiro">
        <ul>

          <li nz-menu-item nzMatchRouter>
            <a routerLink="/app/quote">
              <span nz-icon nzType="file-text"></span>
              <span>Cotações</span>
            </a>
          </li>

          <li nz-menu-item nzMatchRouter>
            <a routerLink="/app/invoice">
              <span nz-icon nzType="file-done"></span>
              <span>Facturas</span>
            </a>
          </li>

        </ul>
      </li>

      <li nz-menu-divider></li>

      <!-- ===== CONTA & SEGURANÇA ===== -->
      <li nz-submenu nzIcon="setting" nzTitle="Conta & Segurança">
        <ul>

          <li nz-menu-item nzMatchRouter>
            <a routerLink="/profile">
              <span nz-icon nzType="profile"></span>
              <span>Perfil</span>
            </a>
          </li>

          <li nz-menu-item nzMatchRouter>
            <a routerLink="/app/users">
              <span nz-icon nzType="user"></span>
              <span>Utilizadores</span>
            </a>
          </li>

        </ul>
      </li>

    </ul>

  </nz-sider>

  <nz-layout>
    <nz-header>
      <div class="app-header">
        <span (click)="isCollapsed = !isCollapsed" class="header-trigger">
          <span
            [nzType]="isCollapsed ? 'menu-unfold' : 'menu-fold'"
            class="trigger"
            nz-icon
          ></span>
        </span>

        <div [nzDropdownMenu]="userMenu" class="user-menu" nz-dropdown>
          <span class="user-icon" nz-icon nzType="user"></span>
          <span class="username">{{ username }}</span>
          <nz-icon nzType="down"></nz-icon>
        </div>

        <nz-dropdown-menu #userMenu="nzDropdownMenu">
          <ul nz-menu>
            <li nz-menu-item>
              <a routerLink="/profile">Perfil</a>
            </li>
            <li (click)="logout()" nz-menu-item>Logout</li>
          </ul>
        </nz-dropdown-menu>
      </div>
    </nz-header>

    <nz-content>
      <div class="inner-content">
        <router-outlet></router-outlet>
      </div>
    </nz-content>
  </nz-layout>
</nz-layout>
