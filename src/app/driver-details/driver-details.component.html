<nz-drawer
  [nzVisible]="visible"
  [nzWidth]="drawerWidth"
  [nzPlacement]="drawerPlacement"
  nzTitle="Detalhes do Motorista"
  [nzMaskClosable]="true"
  (nzOnClose)="close()">

  <ng-container *nzDrawerContent>
    <ng-container *ngIf="driver; else emptyState">

      <!-- Header -->
      <div class="details-header">
        <nz-avatar class="avatar" [nzText]="initials" nzSize="large"></nz-avatar>

        <div class="title-block">
          <div class="name">{{ driver.Name }}</div>

          <div class="meta-row">
            <nz-tag [nzColor]="statusColor">{{ statusLabel }}</nz-tag>
            <span class="pill">{{ driver.CarDescription }}</span>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="actions">
        <button nz-button nzType="primary" (click)="onEdit()">
          <nz-icon nzTheme="outline" nzType="edit"></nz-icon>
          Editar
        </button>

        <button nz-button nzDanger (click)="onDelete()">
          <nz-icon nzTheme="outline" nzType="delete"></nz-icon>
          Eliminar
        </button>

        <button nz-button nzType="default" (click)="close()">
          Fechar
        </button>
      </div>

      <!-- Section: Info -->
      <div class="section">
        <h3 class="section-title">Informação do Motorista</h3>

        <div class="grid">
          <div class="info-card">
            <div class="label">Telefone</div>
            <div class="value">{{ driver.Phone }}</div>
          </div>

          <div class="info-card">
            <div class="label">Carro</div>
            <div class="value">{{ driver.CarDescription }}</div>
          </div>

          <div class="info-card">
            <div class="label">Status</div>
            <div class="value">
              <nz-tag [nzColor]="statusColor">{{ statusLabel }}</nz-tag>
            </div>
          </div>

          <div class="info-card">
            <div class="label">Criado em</div>
            <div class="value">{{ driver.createdAt | date:'yyyy-MM-dd HH:mm' }}</div>
          </div>
        </div>
      </div>

      <!-- Section: Future -->
      <div class="section">
        <h3 class="section-title">Atividade</h3>

        <div class="placeholder">
          <nz-empty nzNotFoundContent="Sem atividade para mostrar (por enquanto)."></nz-empty>
        </div>
      </div>

    </ng-container>

    <ng-template #emptyState>
      <div class="placeholder">
        <nz-empty nzNotFoundContent="Nenhum motorista selecionado."></nz-empty>
      </div>
    </ng-template>
  </ng-container>
</nz-drawer>
