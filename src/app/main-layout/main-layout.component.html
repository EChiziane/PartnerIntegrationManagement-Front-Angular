<nz-layout class="app-layout">
  <nz-sider
    [(nzCollapsed)]="isCollapsed"
    [nzTrigger]="null"
    class="menu-sidebar"
    nzBreakpoint="md"
    nzCollapsible
    nzWidth="256px"
  >
    <div class="sidebar-logo">
      <a>
        <img alt="logo" src="https://ng.ant.design/assets/img/logo.svg"/>
        <h1>TRANSPORTES Chiziane</h1>
      </a>
    </div>

    <ul [nzInlineCollapsed]="isCollapsed" nz-menu nzMode="inline" nzTheme="dark">

      <!-- CSM -->
      <li nz-submenu nzIcon="appstore" nzOpen nzTitle="CSM">
        <ul>
          <li nz-menu-item nzMatchRouter>
            <a routerLink="/app/csm-dashboard">
              <span nz-icon nzType="dashboard"></span> Dashboard
            </a>
          </li>


          <li nz-menu-item nzMatchRouter>
            <a routerLink="/app/carload">
              <span nz-icon nzType="car"></span> Carradas
            </a>
          </li>

          <li nz-menu-item nzMatchRouter>
            <a routerLink="/app/sprint">
              <span nz-icon nzType="partition"></span> Sprints
            </a>
          </li>

          <li nz-menu-item nzMatchRouter>
            <a routerLink="/app/driver">
              <span nz-icon nzType="idcard"></span> Motoristas
            </a>
          </li>

          <li nz-menu-item nzMatchRouter>
            <a routerLink="/app/manager">
              <span nz-icon nzType="solution"></span> Gestores
            </a>
          </li>

          <li nz-menu-item nzMatchRouter>
            <a routerLink="/app/quotation">
              <span nz-icon nzType="bar-chart"></span> Cotacoes
            </a>
          </li>
          <li nz-menu-item nzMatchRouter>
            <a routerLink="/app/invoice">
              <span nz-icon nzType="bar-chart"></span> Facturas
            </a>
          </li>
        </ul>
      </li>

      <!-- ACCOUNT / USERS -->
      <li nz-submenu nzIcon="user" nzOpen nzTitle="Conta">
        <ul>
          <li nz-menu-item nzMatchRouter>
            <a routerLink="/app/users">
              <span nz-icon nzType="user"></span> Utilizadores
            </a>
          </li>

          <li nz-menu-item nzMatchRouter>
            <a routerLink="/profile">
              <span nz-icon nzType="setting"></span> Perfil
            </a>
          </li>
        </ul>
      </li>

    </ul>
  </nz-sider>

  <nz-layout>
    <nz-header>
      <div class="app-header">
        <span (click)="isCollapsed = !isCollapsed" class="header-trigger">
          <span
            [nzType]="isCollapsed ? 'menu-unfold' : 'menu-fold'"
            class="trigger"
            nz-icon
          ></span>
        </span>

        <div [nzDropdownMenu]="userMenu" class="user-menu" nz-dropdown>
          <span class="user-icon" nz-icon nzType="user"></span>
          <span class="username">{{ username }}</span>
          <nz-icon nzType="down"></nz-icon>
        </div>

        <nz-dropdown-menu #userMenu="nzDropdownMenu">
          <ul nz-menu>
            <li nz-menu-item>
              <a routerLink="/profile">Perfil</a>
            </li>
            <li (click)="logout()" nz-menu-item>Logout</li>
          </ul>
        </nz-dropdown-menu>
      </div>
    </nz-header>

    <nz-content>
      <div class="inner-content">
        <router-outlet></router-outlet>
      </div>
    </nz-content>
  </nz-layout>
</nz-layout>
